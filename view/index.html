<!-- OBS 表示ページ。広告・GA4 なし。枠・背景・待ち画面・クレジットは kit の k-view。
     操作ページ（同じブラウザ）から KKit.live で今の場面だけ受け取る。
     字は kit の --k-v-*（どのウィンドウでも 1/3 に縮めて 14px 以上）。 -->
<style>
[hidden]{display:none!important}
.pc-ttl{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-tag{flex:none;padding:.05em .6em;background:var(--k-sumi);color:#fff;font-family:var(--k-bold);font-weight:400;transform:skewX(-8deg)}
.pc-tag.on{background:var(--k-shu)}
.pc-score{flex:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.pc-score b{color:var(--k-shu)}
@container (max-width:1500px){ .pc-tag{display:none} }
@container (max-width:1100px){ .pc-score .n{display:none} }
.k-view-body{display:grid;grid-template-columns:minmax(0,1fr);align-content:center;row-gap:max(8px,1.2cqw)}
.lbl{font-size:var(--k-v-min);font-weight:800;color:var(--k-text-2);line-height:1.2}
@container (max-width:1300px){ .lbl{display:none} }
.scene{margin:0;padding:max(6px,.6cqw) max(14px,2cqw) max(8px,.8cqw);font-family:var(--k-bold);font-size:var(--k-v-l);line-height:1.25;letter-spacing:.02em;word-break:auto-phrase;text-wrap:balance;min-height:calc(var(--k-v-l)*2.5);display:flex;align-items:center}
@container (max-width:1100px){ .scene{font-size:var(--k-v-m);min-height:calc(var(--k-v-m)*2.5)} }
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:max(12px,1.8cqw);padding-top:max(16px,1.8cqw)}   /* 札の上の紐の分 */
.tool{--k-fuda-u:max(1px,.1cqw);--k-himo:max(30px,3.6cqw);height:calc(var(--k-v-m)*2.6);padding:0 max(6px,.6cqw);font-size:var(--k-v-m);line-height:1.15;word-break:keep-all;overflow-wrap:normal;text-wrap:balance}
.call{margin:0;font-family:var(--k-bold);font-size:var(--k-v-s);line-height:1.25;text-align:center}
.call.sub{font-family:var(--k-body);font-weight:800;color:var(--k-text-2)}
.call b{color:var(--k-shu);font-weight:400}
#hanko{position:absolute;left:50%;top:50%;display:grid;place-items:center;width:56cqw;height:23cqw;margin:-11.5cqw 0 0 -28cqw;background:url(/kit/img/d3-hanko-rect.webp) center/100% 100% no-repeat;font-family:var(--k-head);font-weight:800;font-size:9cqw;letter-spacing:.06em;color:var(--k-shu);transform:rotate(-5deg);z-index:5}
#hanko.ng{filter:grayscale(1) brightness(.42) contrast(1.2);color:var(--k-sumi)}
#veil{position:absolute;inset:0;background:rgba(251,243,228,.55);z-index:4}
/* 結果: 巻物の結果欄＋各行の小さな判 */
.end{display:flex;gap:max(16px,2.4cqw);align-items:center;min-height:0}
.end .k-result{flex:none;max-width:32%;box-sizing:border-box;border-width:max(14px,1.4cqw) max(36px,3.2cqw);border-image-width:max(14px,1.4cqw) max(36px,3.2cqw);padding:max(4px,.4cqw) 0}
.end .k-result small{font-size:var(--k-v-min);line-height:1.2}
.end .k-result b{font-size:max(var(--k-v-min),calc(var(--k-v-xl)*var(--f,1)));line-height:1.1}
.nosp .end li span{display:none}
.end .k-result b small{display:inline;font-size:var(--k-v-m);color:var(--k-text-2);font-family:var(--k-head)}
.end ol{flex:1;min-width:0;display:grid;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));gap:calc(max(6px,.8cqw)*var(--f,1)) max(14px,2cqw);margin:0;padding:0;list-style:none}
.end li{display:flex;align-items:center;gap:max(10px,1.2cqw);min-width:0;padding:calc(max(2px,.3cqw)*var(--f,1)) max(6px,.6cqw);border-radius:max(4px,.5cqw)}
.end li .k-stamp{flex:none;width:max(64px,calc(max(92px,6cqw)*var(--f,1)));height:max(64px,calc(max(92px,6cqw)*var(--f,1)));font-size:var(--k-v-min);line-height:1}
.end li span{flex:1;min-width:0;font-size:var(--k-v-min);font-weight:800;line-height:1.2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;word-break:auto-phrase}
.end li.best{background:rgba(255,138,61,.16);box-shadow:inset 0 0 0 max(3px,.25cqw) var(--k-orange)}
.end li .k-tag{flex:none;margin:0;font-size:var(--k-v-min);padding:0 .4em}
/* 縦型（?layout=v・9:16。kit の KKit.view が body.vert を付ける）: 並べ方だけ。道具の札は縦に1列・結果は上下に */
body.vert .k-view-body{align-content:start}
body.vert .scene{display:block;font-size:max(var(--k-v-min),calc(var(--k-v-m)*var(--f,1)));min-height:auto}
body.vert .tools{grid-template-columns:minmax(0,1fr);gap:max(16px,3cqw)}
body.vert .tool{height:max(60px,calc(var(--k-v-m)*1.5*var(--f,1)));font-size:var(--k-v-m)}
body.vert .call{font-size:var(--k-v-min)}
body.vert #hanko{width:84cqw;height:34cqw;margin:-17cqw 0 0 -42cqw;font-size:max(var(--k-v-min),12cqw)}
body.vert .end{flex-direction:column;align-items:stretch}
body.vert .end .k-result{max-width:none;align-self:center}
</style>
</head>
<body class="k-view">
<div class="k-view-stage" id="stage">
  <header class="k-view-top"><span class="pc-ttl" id="ttl">みんなのピンチ脱出</span><span class="pc-tag" id="tag" hidden></span><span class="pc-score" id="score"></span></header>
  <main class="k-view-body" id="main"></main>
  <div id="veil" hidden></div>
  <div id="hanko" hidden></div>
  <div class="k-view-idle" id="idle"><b>みんなのピンチ脱出</b><p>まもなく始まります</p><small>操作ページで始めると、ここに出ます</small></div>
  <footer class="k-view-credit">みんなのピンチ脱出｜pinch.kkpwebninja.com</footer>
</div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  var V = KKit.view({ ch: 'pinch-view' });
  function reveal(el, cls){ if (el && KKit.reveal) { el.classList.add(cls); KKit.reveal(el); } }
  var lastTk = null, lastStamp = null, lastPhase = '', cur = null;
  function toolHtml(t){ return '<div class="tool k-kifuda k-kifuda-himo">' + window.PC_toolHtml(t) + '</div>'; }
  // 道具の字：2行に入らない・幅をはみ出すときだけ小さくする（42pxまで。縦型は窓の幅の比＝kit の KKit.view.minPx）
  function fitTools(){ var v = $('vTools'); if (v) window.PC_fitTools(v.children, 2, KKit.view.minPx(42), 2); }
  function fitAll(){ KKit.fitText($('ttl'), { min: 42 }); fitBody(); }
  // 本文を1画面に（kit の KKit.view.fit）: 大きな字と札の --f を下げ、まだ入らなければ下の呼びかけの行 → 結果の行の文を外す（判子だけに）。名前・道具の字はそのあと収める
  var LN = V.vert() ? 4 : 2;
  function fitBody(){
    var m = $('main'); m.classList.remove('nosp');
    V.fit(m, { min: 0.6, drop: ['.call.sub', '.call', function(b){ if (!b.querySelector('.end')) return false; b.classList.add('nosp'); return true; }],
      after: function(){ fitTools(); var sc = $('vScene'); if (sc) KKit.fitText(sc, { min: 42, lines: LN }); } });
  }
  // 字のデータが後から届いた・窓の大きさが変わった：描き直して字を収め直す（kit の KKit.view.refit）
  KKit.view.refit(function(){ render(cur); fitAll(); });
  function render(s){
    var tt = (s && s.title) || 'みんなのピンチ脱出';
    var inGame = s && s.screen === 'game' && s.phase && s.phase !== 'ready';
    if (!s || (s.screen !== 'result' && !inGame)) { V.idle(true, tt); $('hanko').hidden = true; $('veil').hidden = true; lastPhase = 'idle'; lastTk = null; return; }
    V.idle(false);
    if ($('ttl').textContent !== tt) { $('ttl').textContent = tt; KKit.fitText($('ttl'), { min: 42 }); }
    var main = $('main'), tag = $('tag'), hk = $('hanko');
    tag.hidden = false;
    $('score').innerHTML = s.screen === 'result' || !s.total ? '' : '<span class="n">第' + Math.min(s.i + 1, s.total) + '話 / ' + s.total + '　</span>脱出 <b>' + (s.wins || 0) + '</b>';
    if (s.screen === 'result') {
      tag.textContent = '結果'; tag.className = 'pc-tag on';
      var log = s.log || [], n = log.length, cols = n > 4 ? 2 : 1;
      main.innerHTML = '<div class="end"><div class="k-result"><small>' + n + '話で脱出</small><b class="k-num">' + (s.wins || 0) + '<small>回</small></b></div><ol style="--cols:' + cols + '">'
        + log.map(function(l, k){ return '<li' + (s.best === k ? ' class="best"' : '') + '><i class="k-stamp' + (l.ok ? '' : ' k-stamp-sumi') + '">' + (l.ok ? '成功' : '失敗') + '</i><span>' + esc(l.scene) + '</span>' + (s.best === k ? '<b class="k-tag">一番</b>' : '') + '</li>'; }).join('')
        + '</ol></div>';
      hk.hidden = true; $('veil').hidden = true; lastPhase = 'result';
      fitBody(); return;
    }
    tag.textContent = { story: 'お話タイム', judge: '判定タイム', stamp: '判定' }[s.phase] || '';
    tag.className = 'pc-tag' + (s.phase === 'judge' ? ' on' : '');
    var call = s.phase === 'story' ? '<p class="call sub">配信者のお話を聞いてね</p>'
      : s.phase === 'judge' ? '<p class="call">「<b>成功</b>」か「失敗」をコメント！</p>' : '<p class="call sub">&nbsp;</p>';
    var newTools = lastTk !== s.tk;
    main.innerHTML = '<div class="lbl">ピンチ</div><div class="scene k-panel" id="vScene">' + esc(s.scene || '') + '</div>'
      + '<div class="lbl">使える道具</div><div class="tools" id="vTools">' + (s.tools || []).map(toolHtml).join('') + '</div>' + call;
    fitBody();
    if (newTools) { [].forEach.call($('vTools').children, function(el, k){ el.style.animationDelay = (k * 0.12) + 's'; reveal(el, 'k-reveal-fuda'); }); }
    lastTk = s.tk;
    if (s.phase === 'stamp') {
      hk.textContent = s.stamp ? '脱出成功' : '脱出ならず';
      hk.className = s.stamp ? '' : 'ng';
      hk.hidden = false; $('veil').hidden = false;
      if (lastPhase !== 'stamp' || lastStamp !== s.stamp) reveal(hk, 'k-reveal-stamp');
    } else { hk.hidden = true; $('veil').hidden = true; }
    lastPhase = s.phase; lastStamp = s.stamp;
  }
  KKit.live({ ch: 'pinch-view', role: 'view', onState: function(s){ cur = s; render(s); } }).start();
  window.__pcView = function(){ return cur; };
})();
</script>
