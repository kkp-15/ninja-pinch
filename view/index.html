<!-- OBS 表示ページ。広告・GA4 なし。操作ページ（同じブラウザ）から BroadcastChannel で今の場面だけ受け取る。
     1600x900 で組んだ舞台を、ウィンドウに合わせて縮める（どのサイズでもスクロールなし）。
     字はすべて舞台の上で42px以上（1/3に縮めても14px相当）。 -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:var(--k-kinari)}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:0 0;box-sizing:border-box;padding:36px 56px 40px;display:flex;flex-direction:column;background:var(--k-kinari) url(/kit/img/d4-washi.webp) 0 0/420px auto;font-family:var(--k-body);color:var(--k-sumi)}
.top{display:flex;align-items:center;gap:28px;padding-bottom:16px;border-bottom:4px solid var(--k-sumi)}
.top .ttl{flex:1;min-width:0;font-family:var(--k-head);font-weight:800;font-size:52px;}
.top .ttl.m{font-size:46px}.top .ttl.s{font-size:42px}
.top .ttl{letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:24px}
.tag{flex:none;padding:4px 22px;background:var(--k-sumi);color:#fff;font-family:var(--k-bold);font-size:42px;transform:skewX(-8deg)}
.tag.on{background:var(--k-shu)}
.score{flex:none;font-family:var(--k-bold);font-size:44px;white-space:nowrap;font-variant-numeric:tabular-nums}
.score b{color:var(--k-shu);font-weight:400}
.main{position:relative;flex:1;display:flex;flex-direction:column;min-height:0;padding-top:20px}
.lbl{font-size:42px;font-weight:800;color:var(--k-text-2);line-height:1.2}
.scene{margin:6px 0 0;padding:6px 0 6px 28px;border-left:14px solid var(--k-orange);font-family:var(--k-bold);font-size:72px;line-height:1.25;letter-spacing:.02em;word-break:auto-phrase;text-wrap:balance;min-height:180px;display:flex;align-items:center}
.scene.sm{font-size:62px}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:10px}
.tool{display:grid;place-items:center;height:168px;padding:8px 18px;box-sizing:border-box;border:5px solid var(--k-sumi);border-radius:12px;background:#fff;font-family:var(--k-bold);font-size:64px;line-height:1.15;text-align:center;word-break:auto-phrase;text-wrap:balance;box-shadow:6px 6px 0 var(--k-sumi)}
.tool{word-break:keep-all;overflow-wrap:normal}
.tool.q{color:var(--k-text-2);background:var(--k-kinari);box-shadow:none}
.call{margin-top:26px;font-family:var(--k-bold);font-size:56px;line-height:1.25;text-align:center}
.call.sub{font-family:var(--k-body);font-weight:800;font-size:46px;color:var(--k-text-2)}
.call b{color:var(--k-shu);font-weight:400}
#hanko{position:absolute;left:50%;top:51%;display:grid;place-items:center;width:900px;height:372px;margin:-186px 0 0 -450px;background:url(/kit/img/d3-hanko-rect.webp) center/100% 100% no-repeat;font-family:var(--k-head);font-weight:800;font-size:150px;letter-spacing:.06em;color:var(--k-shu);transform:rotate(-5deg);z-index:5}
#hanko.ng{filter:grayscale(1) brightness(.42) contrast(1.2);color:var(--k-sumi)}
#veil{position:absolute;inset:0;background:rgba(251,243,228,.55);z-index:4}
/* はじまる前 */
.idle{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px}
.idle .big{font-family:var(--k-brush);font-size:120px;line-height:1.15;letter-spacing:.06em;word-break:auto-phrase}
.idle p{margin:0;font-size:48px;font-weight:800;color:var(--k-text-2);line-height:1.4}
/* 結果 */
.end h2{margin:0 0 16px;font-family:var(--k-bold);font-weight:400;font-size:64px;line-height:1.2}
.end h2 b{color:var(--k-shu);font-size:120px;font-weight:400;font-variant-numeric:tabular-nums}
.end ol{margin:0;padding:0;list-style:none}
.end li{display:flex;align-items:center;gap:20px;padding:8px 0;border-top:3px solid var(--k-line-soft);font-size:42px;font-weight:800;line-height:1.25}
.end li b{flex:none;width:2.4em;font-family:var(--k-bold);font-weight:400;color:var(--k-text-2)}
.end li b.ok{color:var(--k-shu)}
.end li span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.end li i{flex:none;font-style:normal;padding:0 16px;border:4px solid var(--k-shu);border-radius:6px;color:var(--k-shu);font-family:var(--k-bold);font-size:42px}
.end li.best{background:rgba(255,138,61,.12)}
.end.many li{padding:4px 0;font-size:42px}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage">
  <div class="top"><span class="ttl" id="ttl">みんなのピンチ脱出</span><span class="score" id="score"></span></div>
  <span class="tag" id="tag" hidden></span>
  <div class="main" id="main"></div>
  <div id="veil" hidden></div>
  <div id="hanko" hidden></div>
</div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function fit(){ var s = $('stage'), z = Math.min(innerWidth / 1600, innerHeight / 900); s.style.transform = 'scale(' + z + ') translate(-50%,-50%)'; }
  window.addEventListener('resize', fit); fit();
  function reveal(el, cls){ if (el && window.KKit && KKit.reveal) { el.classList.add(cls); KKit.reveal(el); } }
  var lastTk = null, lastStamp = null, lastPhase = '';
  function toolHtml(t){ return '<div class="tool">' + window.PC_toolHtml(t) + '</div>'; }
  // 道具の字：2行に入らない・幅をはみ出すときだけ小さくする（42pxまで）
  function fitTools(){ var v = $('vTools'); if (v) window.PC_fitTools(v.children, 2, 42, 2); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTools);
  function render(s){
    if (!s) s = { screen: 'setup', title: 'みんなのピンチ脱出' };
    var tt = s.title || 'みんなのピンチ脱出';
    $('ttl').textContent = tt; $('ttl').className = 'ttl' + (tt.length > 16 ? ' s' : tt.length > 12 ? ' m' : '');
    var main = $('main'), tag = $('tag'), hk = $('hanko');
    var inGame = s.screen === 'game' && s.phase && s.phase !== 'ready';
    $('score').innerHTML = s.screen === 'setup' || !s.total ? '' : '第' + Math.min(s.i + 1, s.total) + '話 / ' + s.total + '　脱出 <b>' + (s.wins || 0) + '</b>';
    tag.className = 'tag';
    if (s.screen === 'result') {
      tag.textContent = '結果'; tag.className = 'tag on';
      $('score').innerHTML = '';
      var log = s.log || [];
      main.innerHTML = '<div class="end' + (log.length > 5 ? ' many' : '') + '"><h2>' + log.length + '話のうち 脱出 <b>' + (s.wins || 0) + '</b></h2><ol>'
        + log.map(function(l, k){ return '<li' + (s.best === k ? ' class="best"' : '') + '><b class="' + (l.ok ? 'ok' : '') + '">' + (l.ok ? '成功' : '失敗') + '</b><span>' + esc(l.scene) + '</span>' + (s.best === k ? '<i>一番うけた</i>' : '') + '</li>'; }).join('')
        + '</ol></div>';
      hk.hidden = true; $('veil').hidden = true; lastPhase = 'result';
      return;
    }
    if (!inGame) {
      tag.textContent = 'はじまるよ';
      main.innerHTML = '<div class="idle"><div class="big">' + esc(tt) + '</div><p>ピンチの場面と、使える道具が3つ出ます。<br>配信者が脱出の話をしたら、<br>「成功」か「失敗」をコメントしてね。</p></div>';
      hk.hidden = true; $('veil').hidden = true; lastPhase = 'idle'; lastTk = null;
      return;
    }
    tag.textContent = { story: 'お話タイム', judge: '判定タイム', stamp: '判定' }[s.phase] || '';
    if (s.phase === 'judge') tag.className = 'tag on';
    var call = s.phase === 'story' ? '<p class="call sub">配信者のお話を聞いてね</p>'
      : s.phase === 'judge' ? '<p class="call">「<b>成功</b>」か「失敗」をコメント！</p>' : '';
    var sc = String(s.scene || '');
    var newTools = lastTk !== s.tk;
    main.innerHTML = '<div class="lrow"><div class="lbl">ピンチ</div>' + tag.outerHTML.replace(' hidden=""', '').replace('id="tag"', '') + '</div><div class="scene' + (sc.length > 26 ? ' sm' : '') + '" id="vScene">' + esc(sc) + '</div>'
      + '<div class="lbl" style="margin-top:18px">使える道具</div><div class="tools" id="vTools">' + (s.tools || []).map(toolHtml).join('') + '</div>' + call;
    fitTools();
    if (newTools) { [].forEach.call($('vTools').children, function(el, k){ el.style.animationDelay = (k * 0.12) + 's'; reveal(el, 'k-reveal-fuda'); }); }
    lastTk = s.tk;
    if (s.phase === 'stamp') {
      hk.textContent = s.stamp ? '脱出成功' : '脱出ならず';
      hk.className = s.stamp ? '' : 'ng';
      hk.hidden = false; $('veil').hidden = false;
      if (lastPhase !== 'stamp' || lastStamp !== s.stamp) reveal(hk, 'k-reveal-stamp');
    } else { hk.hidden = true; $('veil').hidden = true; }
    lastPhase = s.phase; lastStamp = s.stamp;
  }
  var cur = null;
  function take(s){ if (!s || !s.screen || (cur && s.t && cur.t && s.t < cur.t)) return; cur = s; render(s); }
  try { take(JSON.parse(localStorage.getItem('pinch-view-state') || 'null')); } catch (e) { render(null); }
  if (!cur) render(null);
  var ch = null; try { ch = new BroadcastChannel('pinch-view'); ch.onmessage = function(e){ take(e.data); }; ch.postMessage({ hello: 1 }); } catch (e) {}
  // BroadcastChannel が使えないときの保険
  window.addEventListener('storage', function(e){ if (e.key === 'pinch-view-state' && e.newValue) { try { take(JSON.parse(e.newValue)); } catch (x) {} } });
})();
</script>
